name: CI
on: [push, pull_request]
jobs:
  verify:
    env:
      OPENKRAKEN_LFS_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        name: Native terminal build and picker automation
        run: sudo apt-get update && sudo apt-get install -y build-essential xdotool git-lfs rpm libarchive-tools fuse3
      - name: Verify native Git LFS prerequisite
        run: git lfs version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test
      - if: runner.os == 'Linux'
        name: Gitea HTTPS and SSH acceptance
        env:
          OPENKRAKEN_GITEA_TEST: '1'
        run: xvfb-run -a pnpm exec playwright test tests/e2e/gitea.test.ts
      - run: pnpm package
      - if: runner.os == 'Linux'
        env:
          OPENKRAKEN_XDOTOOL: xdotool
        run: xvfb-run -a pnpm smoke:package
      - if: runner.os != 'Linux'
        run: pnpm smoke:package
      - if: runner.os == 'Linux'
        name: Build unsigned Linux test installers
        run: |
          node scripts/check-appimage-launcher.mjs
          pnpm installer --test-metadata --target deb
          pnpm installer --test-metadata --target rpm
          pnpm installer --test-metadata --target AppImage
          node scripts/check-installer-guards.mjs release/installers/linux-x64/test/AppImage/manifest.json
          node scripts/verify-appimage-update.mjs
      - if: runner.os == 'Linux'
        name: Verify extracted installer payloads and desktop behavior
        env:
          OPENKRAKEN_XDOTOOL: xdotool
        run: |
          xvfb-run -a pnpm smoke:installer release/installers/linux-x64/test/deb/manifest.json
          xvfb-run -a pnpm smoke:installer release/installers/linux-x64/test/rpm/manifest.json
          xvfb-run -a pnpm smoke:installer release/installers/linux-x64/test/AppImage/manifest.json
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a pnpm smoke:installer release/installers/linux-x64/test/AppImage/manifest.json
      - if: runner.os == 'Linux'
        name: Debian install and uninstall in a disposable container
        timeout-minutes: 15
        run: |
          artifact=$(node -p 'require("./release/installers/linux-x64/test/deb/manifest.json").artifact.file')
          docker run --rm \
            --env OPENKRAKEN_DISPOSABLE_INSTALL_TEST=1 \
            --volume "$PWD/release/installers/linux-x64/test/deb:/artifacts:ro" \
            --volume "$PWD/scripts/check-deb-lifecycle.sh:/check.sh:ro" \
            docker.io/library/debian@sha256:1e1a22175fbf1b32157ddaf0219e1db4e5401fab2b94ed285add64d18587cd2d \
            bash /check.sh "/artifacts/$artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: test-results/
