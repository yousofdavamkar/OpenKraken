name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        name: Native terminal build and picker automation
        run: sudo apt-get update && sudo apt-get install -y build-essential xdotool
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test
      - if: runner.os == 'Linux'
        name: Gitea HTTPS and SSH acceptance
        env:
          OPENKRAKEN_GITEA_TEST: '1'
        run: xvfb-run -a pnpm exec playwright test tests/e2e/gitea.test.ts
      - run: pnpm package
      - if: runner.os == 'Linux'
        env:
          OPENKRAKEN_XDOTOOL: xdotool
        run: xvfb-run -a pnpm smoke:package
      - if: runner.os != 'Linux'
        run: pnpm smoke:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: test-results/
